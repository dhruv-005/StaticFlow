env:
  contexts:
    - name: "StaticFlow-API-Context"
      urls:
        - "http://localhost:3000"
        - "http://host.docker.internal:3000"
      includePaths:
        - "http://localhost:3000/api/.*"
        - "http://host.docker.internal:3000/api/.*"
      authentication:
        method: "manual"
      sessionManagement:
        method: "headers"

rules:
  - id: 40018  # SQL Injection
    threshold: "MEDIUM"
    strength: "HIGH"
  - id: 40012  # Cross Site Scripting (Reflected)
    threshold: "MEDIUM"
    strength: "HIGH"
  - id: 10055  # CSP Header Missing
    threshold: "LOW"
    strength: "MEDIUM"
  - id: 10038  # Content-Type Header Missing
    threshold: "LOW"
    strength: "MEDIUM"
  - id: 10020  # X-Frame-Options Header Scanner
    threshold: "LOW"
    strength: "MEDIUM"
