version: "3.9"

services:
  # ── Frontend (Next.js) ──
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
      - redis
    restart: unless-stopped
    networks:
      - staticflow-net

  # ── Backend (FastAPI) ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - BACKEND_SECRET_KEY=${BACKEND_SECRET_KEY}
      - OLLAMA_BASE_URL=http://ollama:11434
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
      - postgres
    restart: unless-stopped
    networks:
      - staticflow-net

  # ── PostgreSQL ──
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=staticflow
      - POSTGRES_PASSWORD=staticflow_dev_2024
      - POSTGRES_DB=staticflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - staticflow-net

  # ── Redis ──
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - staticflow-net

  # ── Ollama (Local AI) ──
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - staticflow-net

  # ── Security Scanner (OWASP ZAP) ──
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    ports:
      - "8080:8080"
    command: zap.sh -daemon -host 0.0.0.0 -port 8080 -config api.disablekey=true
    restart: unless-stopped
    networks:
      - staticflow-net

volumes:
  postgres_data:
  redis_data:
  ollama_data:

networks:
  staticflow-net:
    driver: bridge
